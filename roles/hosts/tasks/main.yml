---
- name: Remove legacy Ansible marker lines from /etc/hosts
  ansible.builtin.replace:
    path: /etc/hosts
    regexp: '^# (BEGIN|END) ANSIBLE MANAGED AGAHYARAI HOSTS\n?'
    replace: ''

- name: Add Agahyarai service names to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    state: present
  loop: "{{ agahyarai_host_entries }}"
