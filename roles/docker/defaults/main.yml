---
docker_apt_architecture: "{{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else ansible_architecture }}"
docker_compose_architecture: "{{ 'x86_64' if ansible_architecture in ['x86_64', 'amd64'] else 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else ansible_architecture }}"
